<svg viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <style>
    .box{fill:#f7fafd;stroke:#333;stroke-width:2}
    .name{font-size:15px;font-weight:bold;fill:#222}
    .sub{font-size:11px;fill:#666}
    .pin{font-size:12px;fill:#222}
    .ttl{font-size:19px;font-weight:bold;fill:#1F6FB2}
    .cap{font-size:12px;fill:#555}
    .leg{font-size:12px;fill:#222}
    .warn{font-size:12px;font-weight:bold;fill:#c0392b}
    .w3{stroke:#c0392b;stroke-width:2.5;fill:none}
    .wg{stroke:#222;stroke-width:2.5;fill:none}
    .wd{stroke:#1f6fb2;stroke-width:2.5;fill:none}
    .wc{stroke:#27ae60;stroke-width:2.5;fill:none}
    .wb{stroke:#e67e22;stroke-width:2.5;fill:none}
    .wj{stroke:#8e44ad;stroke-width:2.5;fill:none}
    .dash{stroke:#9aa7b3;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
  </style>

  <rect x="6" y="6" width="968" height="608" fill="#ffffff" stroke="#1F6FB2" stroke-width="2"/>
  <text x="26" y="36" class="ttl">Bedradingsschema &#8211; ESP32-S3-Touch-LCD-1.69 + druksensor</text>
  <text x="26" y="54" class="cap">Vier draden naar de sensor; IMU, touch-LCD en accu-laden zitten al op het bord. Sensor: BMP388 of BME680 (firmware herkent beide).</text>

  <rect class="box" x="60" y="120" width="300" height="300" rx="8"/>
  <text x="210" y="150" class="name" text-anchor="middle">Waveshare ESP32-S3</text>
  <text x="210" y="168" class="name" text-anchor="middle">Touch-LCD 1.69</text>
  <rect class="dash" x="78" y="184" width="200" height="86" rx="6"/>
  <text x="86" y="202" class="sub">Onboard (zelfde I2C-bus):</text>
  <text x="86" y="220" class="sub">&#8226; touch CST816        (0x15)</text>
  <text x="86" y="238" class="sub">&#8226; QMI8658 IMU         (0x6B)</text>
  <text x="86" y="256" class="sub">&#8226; RTC                 (0x51)</text>
  <text x="86" y="268" class="sub">&#8226; MX1.25 accu-lader via USB-C</text>

  <text x="356" y="292" class="pin" text-anchor="end">3V3</text>
  <text x="356" y="324" class="pin" text-anchor="end">G (GND)</text>
  <text x="356" y="356" class="pin" text-anchor="end">SDA (GPIO11)</text>
  <text x="356" y="388" class="pin" text-anchor="end">SCL (GPIO10)</text>
  <line class="w3" x1="360" y1="288" x2="600" y2="288"/>
  <line class="wg" x1="360" y1="320" x2="600" y2="320"/>
  <line class="wd" x1="360" y1="352" x2="600" y2="352"/>
  <line class="wc" x1="360" y1="384" x2="600" y2="384"/>

  <text x="150" y="440" class="pin">MX1.25 accu</text>
  <line class="wb" x1="150" y1="446" x2="150" y2="486"/>
  <line class="wg" x1="180" y1="446" x2="180" y2="486"/>
  <rect class="box" x="84" y="486" width="176" height="60" rx="6"/>
  <text x="172" y="510" class="name" text-anchor="middle">LiPo 3,7V</text>
  <text x="172" y="528" class="sub" text-anchor="middle">MX1.25-stekker</text>
  <text x="286" y="506" class="warn">Polariteit controleren</text>
  <text x="286" y="522" class="warn">v&#243;&#243;r het insteken!</text>
  <text x="286" y="540" class="cap">Start op accu: accu erin, dan PWR-knop.</text>

  <rect class="box" x="600" y="248" width="230" height="200" rx="8"/>
  <text x="715" y="286" class="name" text-anchor="middle">BMP388 of BME680</text>
  <text x="715" y="304" class="sub" text-anchor="middle">barometer (hoogte)</text>
  <text x="606" y="292" class="pin">VCC</text>
  <text x="606" y="324" class="pin">GND</text>
  <text x="606" y="356" class="pin">SDA</text>
  <text x="606" y="388" class="pin">SCL</text>
  <text x="606" y="420" class="pin">CSB/CS</text>
  <text x="700" y="420" class="pin">SDO</text>

  <path class="wj" d="M672,416 L672,404 L790,404 L790,288"/>
  <circle cx="790" cy="288" r="4" fill="#8e44ad"/>
  <path class="wj" d="M740,416 L740,436 L860,436 L860,320"/>
  <circle cx="860" cy="320" r="4" fill="#8e44ad"/>
  <line class="w3" x1="600" y1="288" x2="880" y2="288" stroke-dasharray="2 3" opacity="0.35"/>
  <line class="wg" x1="600" y1="320" x2="880" y2="320" stroke-dasharray="2 3" opacity="0.35"/>

  <rect x="600" y="470" width="356" height="118" rx="6" fill="#fdf3f2" stroke="#e6b0aa"/>
  <text x="616" y="492" class="warn">Twee jumpers OP DE MODULE (niet vergeten!)</text>
  <text x="616" y="512" class="leg">&#8226; CSB (BMP388) / CS (BME680) &#8594; VCC : dwingt I2C af</text>
  <text x="616" y="530" class="leg">&#8226; SDO &#8594; GND = 0x76, of SDO &#8594; VCC = 0x77</text>
  <text x="616" y="552" class="cap">Zwevende CSB = chip blijft in SPI-modus: hij geeft wel een</text>
  <text x="616" y="568" class="cap">acknowledge, maar levert alleen nullen (chip-ID 0x00).</text>

  <rect x="600" y="92" width="356" height="128" rx="6" fill="#f7fafd" stroke="#cdddea"/>
  <text x="616" y="114" class="ttl" font-size="14">Legenda</text>
  <line class="w3" x1="616" y1="132" x2="648" y2="132"/><text x="656" y="136" class="leg">3V3 (voeding +) &#8211; niet 5V</text>
  <line class="wg" x1="616" y1="154" x2="648" y2="154"/><text x="656" y="158" class="leg">GND (massa)</text>
  <line class="wd" x1="616" y1="176" x2="648" y2="176"/><text x="656" y="180" class="leg">SDA (I2C-data, GPIO11)</text>
  <line class="wc" x1="616" y1="198" x2="648" y2="198"/><text x="656" y="202" class="leg">SCL (I2C-klok, GPIO10)</text>
  <line class="wj" x1="820" y1="132" x2="852" y2="132"/><text x="860" y="136" class="leg">jumper</text>
  <line class="wb" x1="820" y1="154" x2="852" y2="154"/><text x="860" y="158" class="leg">accu</text>

  <text x="26" y="586" class="cap">Adressen botsen niet: druksensor 0x76/0x77, IMU 0x6B, touch 0x15, RTC 0x51. Een externe schakelaar is niet nodig; het bord heeft een PWR-knop.</text>
</svg>
